name: Build and release

# Builds both platforms on a tagged push and attaches them to one release.
#
# macOS runs on this repository's own runner (~/actions-runner on the Mac):
# GitHub's hosted macOS images never get assigned here - macos-14 was retired on
# 2026-11-02 and macos-15 sat queued for 15+ minutes twice. Running locally also
# puts the Apple Development identity in reach, so a rebuild keeps the TCC
# Accessibility grant. Windows builds on the hosted windows-latest image.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: [self-hosted, macOS, ARM64]
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The build freezes its output tree read-only, and git cannot delete
          # read-only files. Clearing the previous bundle is handled below.
          clean: false

      - name: Clear previous build
        run: |
          chmod -R u+w dist 2>/dev/null || true
          rm -rf dist

      - name: Prepare relocatable runtime
        id: python
        run: |
          # Homebrew's Python hardcodes sys.prefix, so a copy of it refuses to
          # run from the bundle ("unexpected sys.prefix ... not relocatable").
          # The interpreter inside an installed YesDev.app is relocatable by
          # construction - the previous build proved it - so it seeds this one.
          # A copy also loses its code identity and is killed on launch, hence
          # the ad-hoc re-sign before the first run.
          SRC="/Applications/YesDev.app"
          if [ ! -x "$SRC/Contents/MacOS/YesDev" ]; then
            echo "::error::No installed YesDev.app to seed the runtime from"
            exit 1
          fi
          RT="$RUNNER_TEMP/rt"
          rm -rf "$RT"
          mkdir -p "$RT/bin"
          ditto "$SRC/Contents/lib" "$RT/lib"
          chmod -R u+w "$RT/lib"
          cp "$SRC/Contents/MacOS/YesDev" "$RT/bin/YesDev"
          codesign --force --sign - "$RT/bin/YesDev"
          "$RT/bin/YesDev" -c "import sys, tkinter; print('staged', sys.prefix, sys.version.split()[0], 'Tk', tkinter.TkVersion)"
          echo "python=$RT/bin/YesDev" >> "$GITHUB_OUTPUT"

      - name: Import signing identity
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d ' "')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning

      - name: Unlock login keychain
        run: |
          # A self-hosted runner has no GUI security session: the login keychain
          # is locked there and codesign fails with errSecInternalComponent
          # ("User interaction is not allowed" when prompting for the key).
          # The password lives in ~/actions-runner/.env, which the runner injects
          # into every job, so it never leaves this machine.
          if [ -n "$KEYCHAIN_PASSWORD" ] && \
             security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$HOME/Library/Keychains/login.keychain-db" 2>/dev/null; then
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
              -k "$KEYCHAIN_PASSWORD" "$HOME/Library/Keychains/login.keychain-db" > /dev/null 2>&1 || true
            echo "keychain unlocked; the build will sign with the certificate"
          else
            echo "::warning::KEYCHAIN_PASSWORD missing or wrong; falling back to ad-hoc signing, which drops the Accessibility grant on every upgrade"
            echo "YESDEV_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: Diagnose signing
        run: |
          whoami
          security list-keychains -d user
          security show-keychain-info ~/Library/Keychains/login.keychain-db || true
          security find-identity -v -p codesigning || true
          echo "console user: $(stat -f%Su /dev/console)"

      - name: Build app
        run: |
          python3 packaging/build_macos_app.py \
            --python "${{ steps.python.outputs.python }}" --output dist
          codesign -dv dist/YesDev.app 2>&1 | grep -E "Identifier|TeamIdentifier|Authority" || true
          file dist/YesDev.app/Contents/MacOS/YesDev
          codesign --verify --deep --strict dist/YesDev.app && echo "signature valid"

      - name: Package DMG
        id: pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in v*|"") VERSION="dev-${GITHUB_SHA::7}";; esac
          NAME="YesDev-${VERSION}-macos-universal2.dmg"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto dist/YesDev.app "$STAGE/YesDev.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Yes, Dev" -srcfolder "$STAGE" -ov -format UDZO "$NAME"
          ls -lh "$NAME"
          hdiutil verify "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: yesdev-macos
          path: ${{ steps.pack.outputs.name }}

      - name: Unlock build tree
        if: always()
        run: chmod -R u+w dist 2>/dev/null || true

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            V=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building $V"

      - name: Clear previous build
        shell: pwsh
        run: if (Test-Path build) { Remove-Item -Recurse -Force build }

      - name: Install Python 3.14 with Tcl/Tk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The python.org installer is the complete layout build_windows.py
          # expects: pythonw.exe, Lib, DLLs and tcl all present.
          $url = "https://www.python.org/ftp/python/3.14.5/python-3.14.5-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\python-setup.exe"
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\python-setup.exe" -ArgumentList @(
            "/quiet", "InstallAllUsers=1", "TargetDir=C:\py314",
            "Include_tcltk=1", "Include_pip=1", "Include_test=0", "PrependPath=0"
          )
          & "C:\py314\python.exe" -c "import sys, tkinter; print(sys.version.split()[0], 'Tk', tkinter.TkVersion)"

      - name: Build portable ZIP
        run: |
          C:\py314\python.exe packaging\build_windows.py `
            --version ${{ steps.v.outputs.version }} --output build

      - uses: actions/upload-artifact@v4
        with:
          name: yesdev-windows
          path: build/YesDev-*-windows-x64.zip

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ls -lh assets
          ( cd assets && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt )

          NOTES="$(awk -v tag="${TAG#v}" '
            $0 ~ "^## " tag " " {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md)"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            printf '%s\n' "${NOTES:-See CHANGELOG.md.}" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" \
              --title "Yes, Dev ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              assets/*
          fi
          gh release view "$TAG" --json url --jq .url

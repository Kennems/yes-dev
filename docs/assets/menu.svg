<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="The Yes, Dev menu">
  <rect width="880" height="360" fill="#ffffff"/>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="32" y="34" font-size="15" font-weight="600" fill="#14161C">The menu, top to bottom</text>

    <!-- menu panel -->
    <rect x="32" y="60" width="290" height="276" rx="10" fill="#2B2F36" stroke="#1E2228"/>
    <text x="56" y="88" font-size="12.5" fill="#9AA3B2">Running · 3 approvals</text>
    <line x1="32" y1="104" x2="322" y2="104" stroke="#3D434D" stroke-width="1"/>
    <text x="56" y="128" font-size="13" fill="#EDEFF3">✓  Auto-approve</text>
    <text x="56" y="154" font-size="13" fill="#EDEFF3">Settings…</text>
    <text x="56" y="180" font-size="13" fill="#EDEFF3">Fast focus: off</text>
    <line x1="32" y1="196" x2="322" y2="196" stroke="#3D434D" stroke-width="1"/>
    <text x="56" y="220" font-size="13" fill="#EDEFF3">Open log</text>
    <text x="56" y="246" font-size="13" fill="#EDEFF3">Open relay log</text>
    <line x1="32" y1="262" x2="322" y2="262" stroke="#3D434D" stroke-width="1"/>
    <text x="56" y="286" font-size="13" fill="#EDEFF3">About</text>
    <text x="56" y="312" font-size="13" fill="#EDEFF3">Quit</text>

    <!-- leaders -->
    <g stroke="#C9D2DF" stroke-width="1.2" fill="none">
      <path d="M322 84h44"/>
      <path d="M322 154h44"/>
      <path d="M322 233h44"/>
      <path d="M322 299h44"/>
    </g>
    <g fill="#C9D2DF">
      <circle cx="370" cy="84" r="3"/>
      <circle cx="370" cy="154" r="3"/>
      <circle cx="370" cy="233" r="3"/>
      <circle cx="370" cy="299" r="3"/>
    </g>

    <!-- notes -->
    <g font-size="12.5" fill="#5A6472">
      <text x="388" y="80" font-weight="600" fill="#14161C">Is it working right now</text>
      <text x="388" y="98">State and the approval count. If this line is</text>
      <text x="388" y="115">grey and static, the watcher is not running.</text>

      <text x="388" y="146" font-weight="600" fill="#14161C">Everyday controls</text>
      <text x="388" y="164">Master switch, the settings window, and the</text>
      <text x="388" y="181">focus mode you last chose.</text>

      <text x="388" y="225" font-weight="600" fill="#14161C">The two logs</text>
      <text x="388" y="243">Main log: why a dialog was or was not</text>
      <text x="388" y="260">answered. Relay log: client connections.</text>

      <text x="388" y="291" font-weight="600" fill="#14161C">About and Quit</text>
      <text x="388" y="309">About reopens the first-run window. Quit</text>
      <text x="388" y="326">stops the tray and the watcher together.</text>
    </g>
  </g>
</svg>
